name: Apply Railway migration

on:
  push:
    branches: [main]
    paths: [migration.patch, .github/workflows/apply-migration.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified migration
        run: |
          git apply --index migration.patch
          rm migration.patch .github/workflows/apply-migration.yml
          git add --all
          git -c user.name='Safawala Migration' -c user.email='actions@users.noreply.github.com' commit -m 'Migrate Safawala CRM runtime to Railway'
          git push origin HEAD:main
